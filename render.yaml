services:
  - type: web
    name: myeoong-copytrader
    runtime: node
    plan: free
    buildCommand: npx --yes pnpm@11.22.0 install --frozen-lockfile
    startCommand: npm run bot -- --mode=live
    healthCheckPath: /
    envVars:
      - key: HELIUS_API_KEY
        sync: false
      - key: HELIUS_RPC_ENDPOINT
        sync: false
      - key: LASERSTREAM_ENDPOINT
        sync: false
      - key: BOT_WALLET_PRIVATE_KEY
        sync: false
      - key: WATCH_WALLETS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_EXTENDED
        value: "true"
      - key: TELEGRAM_WEBHOOK_MODE
        value: "false"
      - key: TELEGRAM_COOLDOWN_MS
        value: "5000"
      - key: TELEGRAM_COOLDOWN_NOTIFY_MS
        value: "60000"
      - key: TELEGRAM_POLL_INTERVAL_MS
        value: "30000"
      - key: TELEGRAM_GETUPDATES_TIMEOUT_SEC
        value: "30"
      - key: TELEGRAM_POLL_BACKOFF_MS
        value: "300000"
      - key: MODE
        value: live
      - key: MIN_BALANCE
        value: "0"
      - key: PUMPFUN_BUY_AMOUNT
        value: "0.002"
      - key: PUMPSWAP_BUY_AMOUNT
        value: "0.002"
      - key: MIN_TRADE_AMOUNT
        value: "0.001"
      - key: PUMPFUN_SLIPPAGE_BPS
        value: "500"
      - key: PUMPSWAP_SLIPPAGE_BPS
        value: "1000"
      - key: RPC_COMMITMENT
        value: processed
      - key: PUMPFUN_ENABLED
        value: "true"
      - key: PUMPSWAP_ENABLED
        value: "true"
